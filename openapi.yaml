components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Required only when discovery's auth is not null (chapter 5).
  schemas:
    DiscoveryDocument:
      title: DiscoveryDocument
      description: 'What a scribe service publishes at /.well-known/scribe-exchange: versions, how to log in, what it can
        do, which models it offers, which profiles are installed.'
      type: object
      required:
      - protocol
      - protocol_version
      - supported_versions
      - service
      - endpoints
      - auth
      - capabilities
      - models
      - languages
      - profiles
      properties:
        protocol:
          type: string
          const: scribe-exchange
          description: Always the string "scribe-exchange".
        protocol_version:
          $ref: '#/components/schemas/DiscoveryDocument.version'
          description: Newest protocol version this service implements.
        supported_versions:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/DiscoveryDocument.version'
          description: Every major version still served, each with its newest minor.
        deprecated_versions:
          type: array
          default: []
          items:
            type: object
            required:
            - version
            - sunset_date
            properties:
              version:
                $ref: '#/components/schemas/DiscoveryDocument.version'
              sunset_date:
                type: string
                format: date
                description: Day the version stops being served (YYYY-MM-DD).
              migration_guide:
                type: string
                format: uri
          description: Versions announced for removal.
        service:
          type: object
          required:
          - name
          properties:
            name:
              type: string
              description: Human-readable name of this deployment.
            documentation_url:
              type: string
              format: uri
            support_email:
              type: string
              format: email
            security_contact:
              type: string
              description: Where to report a vulnerability (email or URL).
        endpoints:
          type: object
          required:
          - base_url
          properties:
            base_url:
              type: string
              format: uri
              description: Where /v1/ lives. All paths in the spec are relative to this.
        auth:
          oneOf:
          - type: 'null'
          - type: object
            required:
            - authorization_servers
            properties:
              authorization_servers:
                type: array
                minItems: 1
                items:
                  type: string
                  format: uri
                description: OpenID Connect / OAuth 2 issuers that mint the bearer tokens this service accepts.
              scopes_supported:
                type: array
                items:
                  type: string
                description: Optional. Scopes the service understands.
          description: 'null: no authentication required. Object: a bearer token is required; these issuers mint it.'
        capabilities:
          type: object
          required:
          - sources
          - templates
          - documents
          - output_formats
          properties:
            sources:
              type: object
              required:
              - max_per_session
              - kinds
              description: What may be put into a session and the limits per kind. audio must be present.
              properties:
                max_per_session:
                  type: integer
                  minimum: 1
                  description: Total sources of all kinds one session may hold.
                kinds:
                  type: object
                  required:
                  - audio
                  description: One entry per accepted source kind. A kind not listed is refused.
                  properties:
                    audio:
                      type: object
                      required:
                      - max
                      - input
                      - formats
                      - max_chunk_seconds
                      - max_seconds
                      - inactivity_seconds
                      properties:
                        max:
                          type: integer
                          minimum: 1
                        input:
                          type: array
                          minItems: 1
                          items:
                            type: string
                          description: 'Open list: chunked, file, stream (reserved). Must contain chunked or file.'
                        formats:
                          type: array
                          minItems: 1
                          items:
                            type: string
                          description: Accepted audio MIME types.
                        max_chunk_seconds:
                          type: integer
                          minimum: 1
                          description: Longest chunk. Default 25.
                        max_seconds:
                          type: integer
                          minimum: 1
                          description: Longest single recording.
                        inactivity_seconds:
                          type: integer
                          minimum: 1
                          description: No chunk for this long ends the recording.
                    text:
                      type: object
                      required:
                      - max
                      - max_chars
                      properties:
                        max:
                          type: integer
                          minimum: 1
                        max_chars:
                          type: integer
                          minimum: 1
                    file:
                      type: object
                      required:
                      - max
                      - max_bytes
                      - content_types
                      - url_fetch
                      properties:
                        max:
                          type: integer
                          minimum: 1
                        max_bytes:
                          type: integer
                          minimum: 1
                        content_types:
                          type: array
                          minItems: 1
                          items:
                            type: string
                        url_fetch:
                          type: boolean
                    reference:
                      type: object
                      required:
                      - max
                      properties:
                        max:
                          type: integer
                          minimum: 1
                  additionalProperties:
                    type: object
                    required:
                    - max
                    properties:
                      max:
                        type: integer
                        minimum: 1
                    description: A kind this version does not define; must at least carry max.
            templates:
              type: object
              required:
              - max_instruction_chars
              - max_per_caller
              properties:
                max_instruction_chars:
                  type: integer
                  minimum: 1
                max_per_caller:
                  type: integer
                  minimum: 1
            documents:
              type: object
              required:
              - max_content_bytes
              properties:
                max_content_bytes:
                  type: integer
                  minimum: 1
            output_formats:
              type: array
              minItems: 1
              items:
                type: string
              description: 'Open list. Known: markdown, json, text, html.'
        models:
          type: object
          required:
          - stt
          - structuring
          properties:
            stt:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/DiscoveryDocument.model'
              description: Speech-to-text models the deployer has enabled.
            structuring:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/DiscoveryDocument.model'
              description: Models that write documents, enabled by the deployer.
        languages:
          type: object
          required:
          - supported
          - auto_detection
          properties:
            supported:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/DiscoveryDocument.language'
            auto_detection:
              type: boolean
              description: Whether the service can detect the spoken language without a hint.
        profiles:
          type: array
          items:
            type: object
            required:
            - name
            - version
            - base_url
            properties:
              name:
                type: string
                pattern: ^[a-z][a-z0-9_-]*$
              version:
                $ref: '#/components/schemas/DiscoveryDocument.version'
              base_url:
                type: string
                format: uri
              documentation_url:
                type: string
                format: uri
            additionalProperties: true
          description: Installed profiles. Empty when none.
    Session:
      title: Session
      description: 'A folder of sources and the documents made from them. Has no outcome: it is active or archived.'
      type: object
      required:
      - id
      - status
      - metadata
      - created_at
      - archived_at
      - sources
      - document_ids
      properties:
        id:
          $ref: '#/components/schemas/Session.ulid'
        status:
          type: string
          enum:
          - active
          - archived
          description: Closed list. archived = read-only.
        metadata:
          type: object
          description: Client pass-through, returned unchanged. Max 4 KB. Never interpreted by the service.
        created_at:
          type: string
          format: date-time
        archived_at:
          type:
          - string
          - 'null'
          format: date-time
        sources:
          type: array
          items:
            $ref: '#/components/schemas/Source'
          description: Every source, in creation order. Omitted in list responses, which carry source_count instead.
        source_count:
          type: integer
          minimum: 0
          description: In list responses only.
        document_ids:
          type: array
          items:
            $ref: '#/components/schemas/Session.ulid'
    SessionCreateRequest:
      title: SessionCreateRequest
      description: Body of POST /v1/sessions. Sources are added afterwards with POST /v1/sessions/{id}/sources.
      type: object
      properties:
        metadata:
          type: object
          description: Client pass-through, max 4 KB.
      additionalProperties: false
    SessionUpdateRequest:
      title: SessionUpdateRequest
      description: Body of PATCH /v1/sessions/{id}. metadata replaces the whole object; status may only become archived. Refused
        on an archived session.
      type: object
      minProperties: 1
      properties:
        metadata:
          type: object
          description: Client pass-through, max 4 KB. Replaces the existing object.
        status:
          type: string
          enum:
          - archived
      additionalProperties: false
    Source:
      title: Source
      description: 'One thing put into a session: a recording (audio), a pasted note (text), a file, or a pointer to earlier
        work (reference). Only audio has a lifecycle. Immutable.'
      type: object
      required:
      - id
      - kind
      - status
      - created_at
      properties:
        id:
          $ref: '#/components/schemas/Source.ulid'
        kind:
          type: string
          description: Open list. This version defines audio, text, file, reference. Clients ignore kinds they do not know.
        status:
          type: string
          enum:
          - ready
          - failed
          - created
          - recording
          - processing
          - success
          - cancelled
          description: Closed list. ready | failed for non-audio kinds; created → recording → processing → success | failed
            | cancelled for audio.
        created_at:
          type: string
          format: date-time
        text:
          type: string
          description: 'text kind: the text itself.'
        file:
          type: object
          required:
          - name
          - content_type
          - size_bytes
          - url
          properties:
            name:
              type: string
            content_type:
              type: string
            size_bytes:
              type: integer
              minimum: 0
            url:
              type: string
              format: uri
              description: 'Where the bytes can be fetched: an API path (bearer applies) or a short-lived signed storage URL.'
          description: file kind. name, content_type, size_bytes and url, where url is where the bytes can be fetched.
        reference:
          type: object
          properties:
            session_id:
              $ref: '#/components/schemas/Source.ulid'
            document_id:
              $ref: '#/components/schemas/Source.ulid'
          oneOf:
          - required:
            - session_id
          - required:
            - document_id
          description: 'reference kind: exactly one of session_id or document_id, that the caller may see.'
        input:
          type: string
          enum:
          - chunked
          - file
          description: audio kind. Closed list in this version; stream reserved.
        language_hints:
          type: array
          items:
            $ref: '#/components/schemas/Source.language'
          description: audio kind. Empty = detect.
        stt_model:
          type: string
          description: audio kind. Id from models.stt.
        recording_started_at:
          type:
          - string
          - 'null'
          format: date-time
        recording_ended_at:
          type:
          - string
          - 'null'
          format: date-time
        completed_at:
          type:
          - string
          - 'null'
          format: date-time
        chunks:
          type: object
          required:
          - received
          - expected
          - transcribed
          properties:
            received:
              type: array
              items:
                type: integer
                minimum: 0
              description: Indexes held, ascending.
            expected:
              type:
              - integer
              - 'null'
              minimum: 1
              description: Total announced at end, or null.
            transcribed:
              type: integer
              minimum: 0
              description: How many chunks have a text or failed (chapter 8).
          description: audio kind.
        warnings:
          type: array
          items:
            type: object
            required:
            - code
            - message
            properties:
              code:
                type: string
                enum:
                - max_duration_reached
                - auto_ended
                - chunk_skipped
                - chunks_missing
              message:
                type: string
              chunk_index:
                type: integer
                minimum: 0
          description: audio kind. Problems that did not stop the recording.
        failure:
          type:
          - object
          - 'null'
          required:
          - code
          - message
          properties:
            code:
              type: string
              enum:
              - transcription_failed
              - audio_unreadable
              - language_unsupported
              - internal_error
              - fetch_failed
            message:
              type: string
          description: Set when status is failed. fetch_failed is for a file given by URL.
        cancel_reason:
          type:
          - string
          - 'null'
          enum:
          - client
          - no_audio
          - null
          description: audio kind. Set when cancelled.
        transport:
          oneOf:
          - $ref: '#/components/schemas/Source.transport'
          - type: 'null'
          description: audio kind. Where and how to send audio. Present while created or recording; null after.
        format:
          type: string
          description: audio kind. MIME type of the audio, one of discovery formats. Fixed at creation.
      allOf:
      - if:
          properties:
            kind:
              const: audio
          required:
          - kind
        then:
          required:
          - input
          - language_hints
          - stt_model
          - recording_started_at
          - recording_ended_at
          - completed_at
          - chunks
          - warnings
          - failure
          - cancel_reason
          - transport
          - format
          properties:
            status:
              enum:
              - created
              - recording
              - processing
              - success
              - failed
              - cancelled
      - if:
          properties:
            kind:
              const: text
          required:
          - kind
        then:
          required:
          - text
          properties:
            status:
              enum:
              - ready
              - failed
      - if:
          properties:
            kind:
              const: file
          required:
          - kind
        then:
          required:
          - file
          properties:
            status:
              enum:
              - ready
              - failed
              - processing
      - if:
          properties:
            kind:
              const: reference
          required:
          - kind
        then:
          required:
          - reference
          properties:
            status:
              enum:
              - ready
              - failed
    SourceCreateRequest:
      title: SourceCreateRequest
      description: JSON body of POST /v1/sessions/{id}/sources. For a file upload this JSON travels in the multipart 'source'
        part and the bytes in the 'file' part.
      type: object
      required:
      - kind
      properties:
        kind:
          type: string
          description: Must be a kind the service lists in discovery.
        input:
          type: string
          enum:
          - chunked
          - file
          description: 'audio: how the recording will arrive. Default chunked.'
        language_hints:
          type: array
          items:
            type: string
            pattern: ^[a-zA-Z]{2,3}(-[a-zA-Z0-9]{2,8})*$
          description: 'audio: languages spoken. Each must be in languages.supported.'
        stt_model:
          type: string
          description: 'audio: id from models.stt. Default: the one marked default.'
        text:
          type: string
          description: 'text: the text itself.'
        url:
          type: string
          format: uri
          description: 'file: fetch from here instead of uploading. Only when discovery says url_fetch: true.'
        session_id:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
          description: 'reference: an earlier session.'
        document_id:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
          description: 'reference: an earlier document.'
        format:
          type: string
          description: 'audio: MIME type of the audio, one of discovery formats. Required for audio.'
        transports:
          type: array
          items:
            type: string
          minItems: 1
          description: 'audio: transport kinds the client can handle, in order of preference. Default ["put"].'
      allOf:
      - if:
          properties:
            kind:
              const: audio
        then:
          required:
          - format
      - if:
          properties:
            kind:
              const: text
        then:
          required:
          - text
      - if:
          properties:
            kind:
              const: reference
        then:
          oneOf:
          - required:
            - session_id
          - required:
            - document_id
      additionalProperties: false
    SourceEndResponse:
      title: SourceEndResponse
      description: Response to POST /v1/sessions/{id}/sources/{sid}/end on an audio source. If gaps is non-empty the source
        stays in recording; the client re-sends those chunks and calls end again.
      type: object
      required:
      - status
      - chunks
      - gaps
      properties:
        status:
          type: string
          enum:
          - recording
          - processing
          - success
          - failed
          - cancelled
        chunks:
          type: object
          required:
          - received
          - expected
          properties:
            received:
              type: array
              items:
                type: integer
                minimum: 0
            expected:
              type:
              - integer
              - 'null'
              minimum: 1
        gaps:
          type: array
          items:
            type: integer
            minimum: 0
          description: Indexes the service does not have. Empty when the source moved on.
    Transcript:
      title: Transcript
      description: The whole text of one audio source. Available once the source is success; written once.
      type: object
      required:
      - source_id
      - stt_model
      - language_detected
      - duration_ms
      - text
      - created_at
      properties:
        source_id:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
        stt_model:
          type: string
        language_detected:
          type:
          - string
          - 'null'
          pattern: ^[a-zA-Z]{2,3}(-[a-zA-Z0-9]{2,8})*$
        duration_ms:
          type: integer
          minimum: 0
        text:
          type: string
          description: Plain text, chunks joined in index order, skipped chunks omitted.
        created_at:
          type: string
          format: date-time
      additionalProperties: false
    TranscriptChunk:
      title: TranscriptChunk
      description: The text of one uploaded chunk. Returned by GET .../sources/{sid}/transcript/chunks/{n} and, under the
        put transport, as the response to the upload itself. Immutable once success.
      type: object
      required:
      - index
      - status
      - audio_offset_ms
      - received_at
      - recorded_at
      - text
      properties:
        index:
          type: integer
          minimum: 0
        status:
          type: string
          enum:
          - queued
          - success
          - failed
        audio_offset_ms:
          type:
          - integer
          - 'null'
          minimum: 0
          description: 'Start of this chunk on the audio timeline: summed length of chunks 0..n-1. null while an earlier chunk
            is missing.'
        received_at:
          type: string
          format: date-time
          description: When the bytes reached the service's storage (service clock).
        recorded_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Client clock for when the chunk was recorded, as sent with end. null until then.
        text:
          type:
          - string
          - 'null'
          description: null unless success.
      additionalProperties: false
    Template:
      title: Template
      description: Plain-language instructions and an output format. Immutable.
      type: object
      required:
      - id
      - name
      - instructions
      - output_format
      - output_json_schema
      - created_at
      properties:
        id:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
        name:
          type: string
          minLength: 1
          maxLength: 200
        instructions:
          type: string
          minLength: 1
        output_format:
          type: string
          description: 'One of discovery output_formats. Known: markdown, json, text, html.'
        output_json_schema:
          type:
          - object
          - 'null'
          description: 'json only: a JSON Schema the output must satisfy.'
        created_at:
          type: string
          format: date-time
      additionalProperties: false
    TemplateCreateRequest:
      title: TemplateCreateRequest
      description: Body of POST /v1/templates.
      type: object
      required:
      - name
      - instructions
      - output_format
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        instructions:
          type: string
          minLength: 1
        output_format:
          type: string
          description: 'One of discovery output_formats. Known: markdown, json, text, html.'
        output_json_schema:
          type: object
          description: Only with output_format json.
      additionalProperties: false
    Document:
      title: Document
      description: Text saved in a session, in one format. revision rises on every save and guards concurrent writes.
      type: object
      required:
      - id
      - session_id
      - output_format
      - content
      - revision
      - created_at
      - updated_at
      properties:
        id:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
        session_id:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
        output_format:
          type: string
        content:
          type:
          - string
          - object
          description: string for markdown/text/html, object for json.
        revision:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      additionalProperties: false
    DocumentCreateRequest:
      title: DocumentCreateRequest
      description: Body of POST /v1/sessions/{id}/documents.
      type: object
      required:
      - output_format
      - content
      properties:
        output_format:
          type: string
          description: One of discovery output_formats.
        content:
          type:
          - string
          - object
      additionalProperties: false
    GenerateRequest:
      title: GenerateRequest
      description: Body of POST /v1/sessions/{id}/generate. The response is a stream of started, delta*, done | error events.
      type: object
      required:
      - template_id
      properties:
        template_id:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
        structuring_model:
          type: string
          description: 'Id from models.structuring. Default: the one marked default.'
        source_ids:
          type: array
          minItems: 1
          items:
            type: string
            pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
          description: 'Sources to read. Default: every ready or success source in the session.'
      additionalProperties: false
    Error:
      title: Error
      description: Body of every error response (HTTP 400 and above).
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              description: Closed list, spec/11-errors.md §11.3.
            message:
              type: string
            details:
              type: object
              description: Extra facts; the defining chapter says what.
          additionalProperties: false
      additionalProperties: false
    DiscoveryDocument.language:
      type: string
      pattern: ^[a-zA-Z]{2,3}(-[a-zA-Z0-9]{2,8})*$
      description: BCP 47 language tag, e.g. en, hi, en-IN.
    DiscoveryDocument.model:
      type: object
      required:
      - id
      - display_name
      properties:
        id:
          type: string
          description: Identifier to send in requests. Opaque to clients.
        display_name:
          type: string
        languages:
          type: array
          items:
            $ref: '#/components/schemas/DiscoveryDocument.language'
          description: Languages this model handles. Absent means any supported language.
        default:
          type: boolean
          description: The model used when a request names none. One per list.
    DiscoveryDocument.version:
      type: string
      pattern: ^[0-9]+\.[0-9]+$
      description: MAJOR.MINOR
    Session.ulid:
      type: string
      pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
    Source.language:
      type: string
      pattern: ^[a-zA-Z]{2,3}(-[a-zA-Z0-9]{2,8})*$
    Source.transport:
      type: object
      required:
      - kind
      description: 'Where and how to send audio. put: a URL under the service''s API. post-form: a pre-signed form straight
        to an object store. The client uses it as given.'
      properties:
        kind:
          type: string
          enum:
          - put
          - post-form
          - websocket
        url:
          type: string
          format: uri
          description: 'put (file) and post-form: the upload URL.'
        url_template:
          type: string
          description: 'put (chunked): contains the literal {n} to replace with the chunk index.'
        headers:
          type: object
          additionalProperties:
            type: string
          description: 'put: request headers to send with every upload.'
        fields:
          type: object
          additionalProperties:
            type: string
          description: 'post-form: form fields to send before the file field.'
        expires_at:
          type: string
          format: date-time
          description: When the URL stops accepting uploads. Fetch the source for a fresh transport after this.
    Source.ulid:
      type: string
      pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
